services:
  buildlog:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      BUILDLOG_ENV: production
      BUILDLOG_WEB_API_KEY: ${BUILDLOG_WEB_API_KEY:?set BUILDLOG_WEB_API_KEY}
      BUILDLOG_MODEL: ${BUILDLOG_MODEL:-ollama_chat/qwen3:8b}
      BUILDLOG_API_BASE: ${BUILDLOG_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - buildlog-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  buildlog-data:
